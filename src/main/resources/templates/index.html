<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1">
    <title>ToDo Management System</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

</head>

<body>

    <div class="container my-2">
        <h1>ToDo List Management System</h1>

        <a th:href="@{/showNewTodoForm}" class="btn btn-primary btn-sm mb-3"> Add ToDoList </a>

        <table border="1" class="table table-striped table-responsive-md">
            <thead>
                <tr>
                   <!-- <th>UserName</th>-->
                    <th>Description</th>
                    <th>Date</th>
                    <th> Actions </th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todoList : ${listOfTodos}">
                  <!--  <td th:text="${todoList.userName}"></td>-->
                    <td th:text="${todoList.descripiton}"></td>
                    <td th:text="${todoList.date}"></td>
                    <td> <a th:href="@{/showTodoListForUpdate/{id}(id=${todoList.id})}" class="btn btn-primary">Update</a>
                        <a th:href="@{/deleteEmployee/{id}(id=${todoList.id})}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
